<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Card</title>
    <style>
        
        body {
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
            margin: 250px;
        }
        .profile-card {
            width: 350px;
            height: 400px;
            padding: 20px;
            background-color: white;
            text-align: center;
            border-radius: 25px;
            box-shadow:
                10px 10px 20px 5px orange,
                -10px -10px 25px 5px blue;
        }

        .profile-image {
            width: 100px;
            height: 100px;
            margin-left:125px;
            background-color: #c5dcff;
            border-radius: 50%;
            box-shadow: 0px 5px 15px 3px rgba(0, 100, 255, 0.3);
        }

        .profile-image span {
            font-size: 70px;
            
        }

        h1 {
            font-family: 'Times New Roman', Times, serif;
            font-size: 27px;
            font-weight: 900;
            color: black;
            text-decoration: underline;
            text-decoration-color: #a970df;
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        h2 {
            font-family: Arial, sans-serif;
            font-size: 20px;
            font-weight: bold;
            color: #7e03d6;
            letter-spacing: 3px;
            margin-bottom: 12px;
        }

        .description {
            font-family: Georgia, serif;
            font-size: 16px;
            font-style: italic;
            color: #1d1d1d;
            text-align: center;
            word-spacing: 3px;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        hr {
            border: 1px solid #898989;
            margin-bottom: 15px;
        }

        h3 {
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .skills {
            font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-size: 14px;
            font-weight: 600;
            word-spacing: 3px;
            line-height: 1.6;
        }

        .skills span {
            color: #e04b0b;
            font-size: 20px;
            margin: 0 5px;
        }
    </style>
</head>

<body>

    <div class="profile-card">

        <div class="profile-image">
           <span>👨🏻‍🎓</span>
        </div>

        <h1>Student Profile</h1>

        <h2> BALA ANIK REDDY</h2>

        <p class="description">
            Dream big, learn continuously,
            and build a better tomorrow.
        </p>

        <hr>

        <h3>Skills</h3>

        <p class="skills">
            Python <span>•</span> SQL <span>•</span> Web Development
        </p>

    </div>

</body>
</html>
